# configs/topologies.yaml
# IEEE 802.11bn OBSS 평가용 고정 토폴로지 T1~T6 선언적 정의.
#
# 좌표 단위: meter
# stas[].ap           : 해당 STA를 서빙하는 AP 인덱스 (association)
# stas[].position     : STA 절대 좌표
# stas[].overlap_with : 서빙 AP 외에 해당 STA가 커버리지 중첩 영역에 놓인 AP 목록.
#                       비어 있지 않으면 overlap STA(cell-edge contended STA)로 표시된다.
# stas[].label        : 그래프 범례 및 로그용 식별자

defaults:
  neighbor_rule:
    method: rssi                # rssi | radius | explicit
    cca_thresh_dbm: -82.0
    tx_power_dbm: 10.0
    path_loss_intercept: -46.67
    path_loss_exponent: 30.0
    min_distance_m: 0.5

topologies:

  T1:
    name: CW_Topo1
    description: "3-AP linear array, 20 m spacing; AP0-AP1 direct, AP0-AP2 hidden"
    ap_positions: [[0.0, 0.0], [20.0, 0.0], [40.0, 0.0]]
    stas:
      - {ap: 0, position: [0.0, -10.0],  label: S0}
      - {ap: 1, position: [20.0, -10.0], label: S1}
      - {ap: 2, position: [40.0, -10.0], label: S2}

  T2:
    name: CW_Topo2
    description: "3-AP linear array, reversed indexing of T1"
    ap_positions: [[40.0, 0.0], [20.0, 0.0], [0.0, 0.0]]
    stas:
      - {ap: 0, position: [40.0, -10.0], label: S0}
      - {ap: 1, position: [20.0, -10.0], label: S1}
      - {ap: 2, position: [0.0, -10.0],  label: S2}

  T3:
    name: CW_Topo3
    description: "4-AP square grid, 30 m pitch, with two inter-cell overlap STAs"
    ap_positions: [[0.0, 0.0], [30.0, 0.0], [0.0, -30.0], [30.0, -30.0]]
    stas:
      - {ap: 0, position: [5.0, -5.0],   label: S0}
      - {ap: 1, position: [35.0, -5.0],  label: S1}
      - {ap: 2, position: [5.0, -35.0],  label: S2}
      - {ap: 3, position: [35.0, -35.0], label: S3}
      # ── overlap STA: AP0/AP1 경계 중앙, AP2/AP3 경계 중앙 ──
      - {ap: 0, position: [15.0, -3.0],  overlap_with: [1], label: S0_ov01}
      - {ap: 2, position: [15.0, -33.0], overlap_with: [3], label: S2_ov23}

  T4:
    name: CW_Topo4
    description: "4-AP asymmetric ring placement, 30 m span"
    ap_positions: [[0.0, 0.0], [30.0, 0.0], [30.0, -30.0], [0.0, -30.0]]
    stas:
      - {ap: 0, position: [5.0, -5.0],   label: S0}
      - {ap: 1, position: [35.0, -5.0],  label: S1}
      - {ap: 2, position: [35.0, -35.0], label: S2}
      - {ap: 3, position: [5.0, -35.0],  label: S3}

  T5:
    name: CW_Topo5
    description: "4-AP dense cluster, 10 m pitch; AP0 serves two STAs"
    ap_positions: [[0.0, 0.0], [10.0, 0.0], [20.0, 0.0], [20.0, -20.0]]
    stas:
      - {ap: 0, position: [0.0, -8.0],   label: S0a}
      - {ap: 0, position: [0.0, -16.0],  label: S0b}
      - {ap: 1, position: [10.0, -8.0],  label: S1}
      - {ap: 2, position: [20.0, -8.0],  label: S2}
      - {ap: 3, position: [20.0, -28.0], label: S3}

  T6:
    name: CW_Topo6
    description: "4-AP distributed T-shape with three-way overlap region at the centre"
    ap_positions: [[0.0, 0.0], [20.0, 0.0], [40.0, 0.0], [20.0, -20.0]]
    stas:
      - {ap: 0, position: [3.0, -8.0],   label: S0}
      - {ap: 1, position: [23.0, -8.0],  label: S1}
      - {ap: 2, position: [43.0, -8.0],  label: S2}
      - {ap: 3, position: [23.0, -28.0], label: S3}
      # ── overlap STA: AP1/AP3 수직 경계, AP1/AP2 수평 경계 ──
      - {ap: 1, position: [20.0, -11.0], overlap_with: [3],    label: S1_ov13}
      - {ap: 2, position: [30.0, -4.0],  overlap_with: [1],    label: S2_ov12}
      - {ap: 3, position: [21.0, -14.0], overlap_with: [1, 2], label: S3_ov123}

# 실험 편의용 그룹 정의 (Section VI 분석에서 토폴로지 특성별 집계에 사용)
groups:
  hidden_node:   [T1, T2]
  dense_grid:    [T3, T4]
  high_density:  [T5, T6]
  with_overlap:  [T3, T6]
  all:           [T1, T2, T3, T4, T5, T6]
