# configs/base.yaml — 논문 Table I / II 기준 공통 파라미터

env:
  mode: "cw"              # cw | cca | joint
  interact_slots: 55556   # 0.5s / 9μs
  max_episodes: 600       # 300s / 0.5s
  seed: 42

agent:
  state_dim: 6
  fused_dim: 8
  history_len: 10
  gamma: 0.9
  tau: 0.004
  eps_start: 1.0
  eps_end: 0.01
  eps_decay: 0.99
  batch_size: 32
  mem_size: 500
  lr: 0.0005
  dueling: false

train:
  n_runs: 5               # 반복 실험 수 (오차 막대용)
  log_interval: 10
  save_interval: 100
  device: "cpu"           # cuda | cpu

eval:
  n_episodes: 100
  exploration: 0.0

logging:
  use_wandb: false
  use_tb: true
  log_dir: "runs"
